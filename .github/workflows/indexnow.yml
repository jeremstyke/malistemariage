name: IndexNow
on:
  push:
    branches: [main]
    paths: ['docs/sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attendre la mise en ligne de GitHub Pages
        run: sleep 90
      - name: Envoyer les URL du sitemap a IndexNow (Bing, Yandex...)
        run: |
          URLS=$(grep -o '<loc>[^<]*' docs/sitemap.xml | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(python3 -c 'import json,sys;print(json.dumps({"host":"malistedemariage.fr","key":"6df37444b12664e32f9d31a11c4d67eb","keyLocation":"https://malistedemariage.fr/6df37444b12664e32f9d31a11c4d67eb.txt","urlList":json.loads(sys.argv[1])}))' "$URLS")
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
